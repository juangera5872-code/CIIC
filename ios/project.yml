name: LidarScan
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    # Pon aquí tu Team ID (o elígelo en Xcode > Signing & Capabilities)
    DEVELOPMENT_TEAM: ""
targets:
  LidarScan:
    type: application
    platform: iOS
    sources: [LidarScan]
    info:
      path: LidarScan/Info.plist
      properties:
        CFBundleDisplayName: LiDAR Scan
        UILaunchScreen: {}
        NSCameraUsageDescription: Se usa la cámara y el sensor LiDAR para escanear espacios y objetos en 3D.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lidarscan
